{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Corporate Payroll{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
        :root { --ink:#132a32; --muted:#667b80; --line:#d7e5e1; --paper:#fff; --wash:#eef5f2; --teal:#137f78; --deep:#0c3540; --gold:#bd8430; --red:#a64040; --shadow:0 18px 45px rgba(16,61,71,.09); }
        * { box-sizing:border-box; } html { background:var(--wash); } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 82% -8%,#cfe9df 0,transparent 32%),linear-gradient(135deg,#f7fbfa 0%,#e9f2ef 100%); font:14px/1.5 "DM Sans",sans-serif; }
        a { color:inherit; transition:color .2s,background .2s,transform .2s,border-color .2s; } .topbar { min-height:80px; padding:0 5vw; display:flex; align-items:center; justify-content:space-between; gap:24px; color:#fff; background:linear-gradient(110deg,#0a303b,#124951); box-shadow:0 3px 16px rgba(12,53,64,.18); }
        .brand { display:flex; align-items:center; gap:12px; text-decoration:none; font:600 15px "Space Grotesk",sans-serif; letter-spacing:.02em; } .brand-mark { display:grid; place-items:center; width:42px; height:42px; border:1px solid #8dd1c6; color:#dffff9; background:rgba(255,255,255,.05); font:600 12px "Space Grotesk",sans-serif; } .brand small { display:block; margin-top:2px; color:#a8ccc7; font:600 9px "DM Sans",sans-serif; letter-spacing:.15em; }
        .nav { display:flex; align-items:center; gap:4px; } .nav a { padding:10px 12px; color:#d8eeea; text-decoration:none; font-size:12px; } .nav a:hover { color:#fff; background:#1a5960; } .nav .outline { margin-left:5px; border:1px solid #6eaaa3; }
        .shell { width:min(1160px,90vw); margin:52px auto 80px; } .eyebrow { margin:0 0 11px; color:var(--teal); font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; } h1,h2 { font-family:"Space Grotesk",sans-serif; font-weight:500; } h1 { margin:0; font-size:clamp(37px,5vw,62px); line-height:1.03; letter-spacing:-.02em; } h2 { margin:0; font-size:25px; letter-spacing:-.01em; } .lede { color:var(--muted); line-height:1.75; }
        .page-head { display:flex; align-items:end; justify-content:space-between; gap:25px; margin-bottom:34px; } .page-head .lede { max-width:420px; margin:0 0 4px; }
        .grid { display:grid; gap:18px; } .two { grid-template-columns:1.35fr .65fr; } .three { grid-template-columns:repeat(3,1fr); } .panel { background:rgba(255,255,255,.95); border:1px solid var(--line); box-shadow:var(--shadow); } .pad { padding:27px; }
        .profile { display:flex; align-items:center; gap:17px; } .avatar { display:grid; place-items:center; flex:0 0 60px; width:60px; height:60px; border-radius:50%; color:#fff; background:linear-gradient(145deg,#d39c4c,#a96f23); box-shadow:inset 0 1px rgba(255,255,255,.35); font:24px "Space Grotesk",sans-serif; } .profile h2 { margin:0 0 4px; } .muted { color:var(--muted); }
        .stat-label { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; } .stat-value { display:block; margin-top:8px; color:var(--deep); font:42px "Space Grotesk",sans-serif; }
        .actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:25px 0 38px; } .button { display:inline-block; padding:12px 17px; border:1px solid #a9c9c1; text-decoration:none; font-weight:700; font-size:12px; } .primary { border-color:var(--teal); color:#fff; background:var(--teal); box-shadow:0 5px 12px rgba(19,127,120,.18); } .button:hover { transform:translateY(-2px); }
        .section-head { display:flex; align-items:end; justify-content:space-between; gap:15px; margin:30px 0 13px; } .section-head span { color:var(--muted); font-size:12px; }
        .table-wrap { overflow-x:auto; } table { width:100%; min-width:620px; border-collapse:collapse; } th,td { padding:16px 18px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; } th { color:var(--muted); background:#f5faf8; font-size:10px; letter-spacing:.12em; text-transform:uppercase; } tr:hover td { background:#fbfdfc; } tr:last-child td { border-bottom:0; } .status { display:inline-block; padding:5px 8px; font-size:10px; font-weight:700; letter-spacing:.08em; } .pending { color:#8b6115; background:#fff2cf; } .approved { color:#176b51; background:#dcf3e9; } .rejected { color:var(--red); background:#fde6e3; }
        .form-panel { max-width:720px; padding:30px; } label { display:block; margin:17px 0 7px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; } input,select,textarea { width:100%; padding:13px; border:1px solid #c8dbd6; color:var(--ink); background:#fbfdfc; font:inherit; } input:focus,select:focus,textarea:focus { outline:3px solid #d6eeea; border-color:var(--teal); } textarea { min-height:120px; resize:vertical; } .date-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; } button { padding:13px 18px; border:0; color:#fff; background:var(--teal); font:inherit; font-weight:700; cursor:pointer; } .error { padding:12px; border:1px solid #f0c5bf; color:var(--red); background:#fff0ed; }
        .empty { padding:45px 30px; color:var(--muted); text-align:center; } .notice { padding:14px 16px; border-left:3px solid var(--gold); color:#6e572b; background:#fff9eb; } .money-grid { grid-template-columns:repeat(3,1fr); } .money { padding:20px; background:#f7fbf9; } .money small { color:var(--muted); } .money strong { display:block; margin-top:7px; font:26px "Space Grotesk",sans-serif; }
        @media (max-width:760px) { .topbar { padding:15px 5vw; align-items:flex-start; } .nav { flex-wrap:wrap; justify-content:flex-end; } .nav a { padding:6px 8px; } .shell { margin-top:34px; } .page-head,.two { display:block; } .page-head .lede { margin-top:15px; } .two > * + * { margin-top:18px; } .three,.money-grid { grid-template-columns:1fr; } .date-grid { display:block; } }
    </style>
</head>
<body>
<header class="topbar"><a class="brand" href="{% if request.user.is_authenticated %}{% if request.user.is_staff %}{% url 'pending_leaves' %}{% else %}{% url 'employee_dashboard' %}{% endif %}{% else %}{% url 'manager_login' %}{% endif %}"><span class="brand-mark">CP</span><span>Corporate Payroll<small>PEOPLE OPERATIONS</small></span></a>{% if request.user.is_authenticated %}<nav class="nav"><a href="{% url 'employee_dashboard' %}">Dashboard</a><a href="{% url 'payroll_calculation' %}">Payroll</a><a href="{% url 'payslip_list' %}">Payslips</a><a href="{% url 'apply_leave' %}">Leave</a>{% if request.user.is_staff %}<a href="{% url 'pending_leaves' %}">Approvals</a><a href="{% url 'manager_employees' %}">Team</a><a href="{% url 'manage_bonuses' %}">Bonuses</a><a href="/admin/">Admin</a>{% endif %}<a class="outline" href="{% url 'manager_logout' %}">Log out</a></nav>{% endif %}</header>
{% block content %}{% endblock %}
</body>
</html>
